<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    FF14 Character Card — Favicon
    
    A minimal sparkle mark composed of four diamond-shaped rays arranged at
    cardinal directions around a small central circle. The silhouette reads
    cleanly at 16×16 and 32×32 without any colour dependency — works equally
    well on light and dark browser chrome.
  -->

  <!-- Outer glow surface (very subtle, adds depth at larger sizes) -->
  <rect width="32" height="32" rx="8" fill="#F5F5F7"/>

  <!-- Primary vertical ray -->
  <path d="M16 5 L17.2 14 L16 16 L14.8 14 Z" fill="#1D1D1F"/>
  <!-- Primary horizontal ray -->
  <path d="M27 16 L18 17.2 L16 16 L18 14.8 Z" fill="#1D1D1F"/>
  <!-- Primary downward ray -->
  <path d="M16 27 L14.8 18 L16 16 L17.2 18 Z" fill="#1D1D1F"/>
  <!-- Primary leftward ray -->
  <path d="M5 16 L14 14.8 L16 16 L14 17.2 Z" fill="#1D1D1F"/>

  <!-- Secondary diagonal rays (shorter, half-opacity for elegance) -->
  <path d="M23.5 8.5 L18.2 14.5 L16 16 L17.5 13.8 Z" fill="#1D1D1F" opacity="0.35"/>
  <path d="M23.5 23.5 L17.5 18.2 L16 16 L18.2 17.5 Z" fill="#1D1D1F" opacity="0.35"/>
  <path d="M8.5 23.5 L13.8 17.5 L16 16 L14.5 18.2 Z" fill="#1D1D1F" opacity="0.35"/>
  <path d="M8.5 8.5 L14.5 13.8 L16 16 L13.8 14.5 Z" fill="#1D1D1F" opacity="0.35"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.8" fill="#1D1D1F"/>
</svg>
