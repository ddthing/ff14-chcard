<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    FF14 Character Card Generator — New Favicon (Crystal Card)
    Style: Warm Minimalism
    Concept: A minimalist card with a diamond crystal profile.
  -->

  <!-- Background Surface (Warm Cream) -->
