  <!--
    Static hosts may serve 404.html before the SPA fallback rules are applied.
    Restore the original route before React Router initializes.
  -->
  <script>
    (() => {
      const redirectKey = 'ff14-chcard:spa-redirect';

      try {
        const currentUrl = new URL(window.location.href);
        const queryRedirect = currentUrl.searchParams.get('__spa_route');
        const redirect = queryRedirect || window.sessionStorage.getItem(redirectKey);
        if (!redirect) return;

        window.sessionStorage.removeItem(redirectKey);
        const target = new URL(redirect, window.location.origin);

        if (target.origin === window.location.origin) {
          window.history.replaceState(null, '', `${target.pathname}${target.search}${target.hash}`);
        }
      } catch {
        // Storage may be unavailable in privacy-restricted browser contexts.
      }
    })();
  </script>
